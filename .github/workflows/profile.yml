name: Refresh profile panels

on:
  schedule: # twice a day
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/**"]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: draw the stats panel
        run: python3 scripts/stats.py "${{ github.repository_owner }}" dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Contribution colours are the --contrib-* tokens from conradium.my.id
      - name: generate the snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#8b42b8&color_dots=#efe7ff,#cdb8ff,#a97fd8,#8b42b8,#1d1528
            dist/snake-dark.svg?color_snake=#ffe17a&color_dots=#2a1f3a,#4a3566,#8b42b8,#cdb8ff,#fff8ec

      - name: push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
